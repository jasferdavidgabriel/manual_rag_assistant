name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: manual-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the CLI inside the container
        run: docker run --rm manual-rag:ci python main.py --help

      - name: Smoke test the API inside the container
        run: |
          docker run -d --name api -p 8000:8000 manual-rag:ci \
            uvicorn manual_rag.api:app --app-dir src --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; echo "API is up"; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
