paths:
  documents: data/raw
  chroma_dir: models/chroma
  eval_set: data/eval/questions.jsonl
  figures_dir: reports/figures
  results_dir: reports

chunking:
  max_lines_per_chunk: 30
  min_chunk_chars: 20
  keep_languages: [en]
  remove_boilerplate: true                          # repeated headers, footers, page numbers
  remove_toc: true                                  # table of contents lines ("Warranty . . . . 9")
  contextual_headers: true                          # prefix each chunk with its product title before embedding

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  device: auto

vector_store:
  collection_name: manual_rag
  distance: cosine

retrieval:
  top_k: 5                                          # eval: right page always in top 5 (Hit@5 = 1.0)
  display_k: 5

llm:
  base_url: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  model: nvidia/nemotron-3.5-lightning-30b-a3b    # reasons by default
  fallback_models:                                # tried in order if the primary fails
    - deepseek-ai/deepseek-v4.1-flash
  timeout: 90                                     # seconds per model before moving on
  max_retries: 0                                  # fallbacks replace silent retries
  temperature: 0.3
  top_p: 0.95
  max_tokens: 8192                                # reasoning models need room to think AND answer
  chat_template_kwargs:                           # model specific switches, sent as extra_body
    enable_thinking: false                        # Nemotron: skip reasoning (~4s instead of ~30s)

upload:                                             # web app limits
  max_pages: 50                                     # reject longer manuals
  min_chars_per_page: 200                           # below this the file is mostly images
